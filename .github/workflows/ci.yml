name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint, test & build (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Fails the build on known high/critical-severity vulnerabilities in
      # dependencies; low/moderate findings are common in transitive deps
      # and would make this too noisy to act on, so only the severities
      # worth blocking a merge over are enforced.
      #
      # GHSA-qwww-vcr4-c8h2 (react-router, high) is deliberately excluded via
      # --ignore below, not silently ignored: the advisory is specific to
      # React Router's RSC/framework server mode, which this app never uses
      # (a Vite SPA on plain react-router-dom BrowserRouter/HashRouter, no
      # @react-router/dev, no SSR/RSC). Fixing it for real means a major
      # version bump of react-router-dom (7.x -> 8.x) with actual regression
      # testing against the running app, not a forced pnpm override that
      # could silently break routing — tracked as follow-up work, not done
      # blindly here. Every other high/critical finding (brace-expansion,
      # postcss, esbuild, uuid, body-parser, tar) is patched for real via
      # pnpm.overrides in package.json.
      #
      # NOTE: package.json's `pnpm.auditConfig.ignoreCves` looks like the
      # "proper" declarative way to do this and is documented as such, but
      # was confirmed NOT to be honored by pnpm 10.19.0 in this workspace
      # (audit still exits 1 with it set) — hence the explicit --ignore flag
      # here instead. Re-test if bumping the pnpm version.
      - name: Dependency audit (high/critical)
        run: pnpm audit --audit-level=high --ignore GHSA-qwww-vcr4-c8h2

  docker-build-admin:
    name: Build admin Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build the deployable admin image to catch Dockerfile/bundle breakage.
      - name: Build admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: false
          tags: smartteams-admin:ci
